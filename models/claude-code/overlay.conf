target: claude-code
model: claude
harness: claude-code
include:
exclude:
emphasis: working-first, never-make-things-up, test-preservation, verify-before-claiming
addenda: no-privately-preamble.md, tool-names.md
default_file: CLAUDE.md
# last reviewed: 2026-09-21
#
# Emphasis is on the four constraints whose violation is most expensive to discover
# late: a hidden problem, a fabricated value, a rewritten assertion, an unearned "done".
# Claude follows these reliably when they are read; the preamble exists because they can
# otherwise be buried under a long rule set late in a session.
