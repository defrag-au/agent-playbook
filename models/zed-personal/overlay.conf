target: zed-personal
model: any
harness: zed
title: Personal instructions
include:
exclude:
exclude_activation: always
emphasis:
addenda:
memory: environment.md, preferences.md
default_file: AGENTS.md
# last reviewed: 2026-09-21
#
# Writes Zed's personal instructions file, `~/.config/zed/AGENTS.md`, which loads for every
# project the user opens — including repositories the playbook knows nothing about.
#
# `exclude_activation: always` is the point of this target. The universal rules ship in every
# repository's block, because a repo is bootstrapped with them and its `AGENTS.md` is
# committed and shared. An agent reads the personal file *and* the project file, so repeating
# those rules here would be duplication with no reader — and the two files are meant to be
# complementary, not overlapping.
#
# What is left is the `memory/` layer: facts about the person and the machine that are true
# regardless of repository and that no repo's block should carry. That is the content this
# file exists for.
#
# No `instruction_files:` — that check is about a repository's first-match order, and there
# is no repository here.
#
# No addenda. The harness mechanics in `models/zed/addenda/` are tied to working in a repo
# (the devshell, the storybook), and every playbook repo already carries them in its own
# block.