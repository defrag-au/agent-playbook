target: zed-personal
model: any
harness: zed
title: Personal instructions
include:
exclude:
emphasis:
addenda: zed-mechanics.md, sandboxed-shell.md
memory: environment.md, preferences.md
default_file: AGENTS.md
# last reviewed: 2026-11-02
#
# Writes Zed's personal instructions file, `~/.config/zed/AGENTS.md`, which loads for every
# project the user opens — including repositories the playbook knows nothing about — and is
# loaded **once**, not once per worktree.
#
# That is what makes it the home of the universal layer. Zed concatenates one instruction file
# per worktree root, so a multi-root workspace would otherwise pay for the `always` rules and
# the harness addenda in every root. Here they are paid once. Repository targets exclude them
# (`exclude_activation: always` in `models/zed/overlay.conf`) and carry only what differs.
#
# The manifest is `fleet/personal/.playbook/project.conf`: no org, ecosystems, renders or
# languages, so only `activation: always` rules resolve. That is the safety property — this
# file is global, so it must never carry an org- or project-specific rule.
#
# No `instruction_files:` — that check is about a repository's first-match order, and there
# is no repository here.
#
# No `skill_dir:` either. Skills are delivered per repository, into the harness's project
# directory; the personal set is not a repository, so a relative path here would name a
# directory no harness reads. `playbook skills` says so rather than guessing.
