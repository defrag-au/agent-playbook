target: zed
model: any
harness: zed
include:
exclude:
emphasis:
addenda: zed-mechanics.md, sandboxed-shell.md
default_file: AGENTS.md
# Where `playbook skills sync` delivers a repository's declared skills. Zed reads global skills
# from `~/.agents/skills` and project skills from `<worktree>/.agents/skills`, and resolves
# **project over global** — the reverse of Claude Code.
skill_dir: .agents/skills
# Zed reads the first match from this ordered list at the worktree root, so anything listed
# above the file we write will shadow it — silently, with no error. `playbook install` and
# `playbook check` warn when one of those files exists in the repo.
# Source: https://zed.dev/docs/ai/instructions, checked 2026-09-21.
instruction_files: .rules, .cursorrules, .windsurfrules, .clinerules, .github/copilot-instructions.md, AGENT.md, AGENTS.md, CLAUDE.md, GEMINI.md
# last reviewed: 2026-09-22
#
# Harness-only overlay. Composes alongside a model overlay: a Zed session running
# DeepSeek Flash wants this and deepseek-flash/ together.
#
# No emphasis. This overlay named `defrag-agent-tools` until 2026-10-25, on the argument that
# the `at-*` habit needs repeating at the moment of the reach. That made a *harness* overlay fail
# for any repository outside the defrag ecosystem — the composer treats an emphasis that resolves
# to nothing as an error, correctly — so it carried org-specific content in the one directory
# that must not. The `agent-tools` rule already ships in full wherever it applies. If the nudge
# turns out to matter, the mechanism is emphasis declared by the manifest that owns the claim,
# not a second target beside this one.
