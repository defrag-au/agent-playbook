target: zed
model: any
harness: zed
include:
exclude:
emphasis: defrag-agent-tools
addenda: zed-mechanics.md, sandboxed-shell.md
default_file: AGENTS.md
# Zed reads the first match from this ordered list at the worktree root, so anything listed
# above the file we write will shadow it — silently, with no error. `playbook install` and
# `playbook check` warn when one of those files exists in the repo.
# Source: https://zed.dev/docs/ai/instructions, checked 2026-09-21.
instruction_files: .rules, .cursorrules, .windsurfrules, .clinerules, .github/copilot-instructions.md, AGENT.md, AGENTS.md, CLAUDE.md, GEMINI.md
# last reviewed: 2026-09-22
#
# Harness-only overlay. Composes alongside a model overlay: a Zed session running
# DeepSeek Flash wants this and deepseek-flash/ together.
#
# One emphasis, and it is not a claim about a model's attention — which is why the list was
# empty before. `defrag-agent-tools` competes with a *habit* rather than an oversight: every
# model that has read shell transcripts reaches for `rg`, and being told once, in a thirty-rule
# block, is not the same as being told at the moment of the reach. Emphasis repeats the rule's
# first bullet verbatim, which is why that bullet is the substitution table's one-line form.
#
# Provisional, and cheap to falsify: if the cnft.dev-workers test shows adoption without it,
# delete it. An emphasis repeats on every turn forever.
