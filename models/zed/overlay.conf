target: zed
model: any
harness: zed
include:
exclude:
emphasis:
addenda: zed-mechanics.md, sandboxed-shell.md
default_file: AGENTS.md
# Zed reads the first match from this ordered list at the worktree root, so anything listed
# above the file we write will shadow it — silently, with no error. `playbook install` and
# `playbook check` warn when one of those files exists in the repo.
# Source: https://zed.dev/docs/ai/instructions, checked 2026-09-21.
instruction_files: .rules, .cursorrules, .windsurfrules, .clinerules, .github/copilot-instructions.md, AGENT.md, AGENTS.md, CLAUDE.md, GEMINI.md
# last reviewed: 2026-09-21
#
# Harness-only overlay. Composes alongside a model overlay: a Zed session running
# DeepSeek Flash wants this and deepseek-flash/ together.
#
# No emphasis. Emphasis is a claim about a model's attention, and this target says
# nothing about which model is driving.
