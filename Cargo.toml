[workspace]
members = [
    "tools/at-core",
    "tools/at-cardano",
    "tools/at-cost",
    "tools/at-crate",
    "tools/at-describe",
    "tools/at-peek",
    "tools/at-recall",
    "tools/at-reach",
    "tools/browser-shot",
    "tools/fleet-sync",
    "tools/image-shot",
    "tools/skill-store",
    "tools/tui-shot",
    "tools/zed-thread-tools",
]
resolver = "2"
# The agent toolkit lives here as separate crates rather than as modules of this one, so the
# composer keeps its no-dependency property at the crate level: `playbook` is still std-only,
# and only the tools take dependencies. See docs/inspection-tools.md.

[workspace.dependencies]
# Sibling crates. Declaring the path once means a rename or a move is one line here, not five.
at-core = { path = "tools/at-core" }
at-cardano = { path = "tools/at-cardano" }
at-cost = { path = "tools/at-cost" }
at-crate = { path = "tools/at-crate" }
at-peek = { path = "tools/at-peek" }
at-reach = { path = "tools/at-reach" }
at-recall = { path = "tools/at-recall" }

# Dependencies with more than one consumer. A dependency with a single consumer stays in that
# crate's manifest: `browser-shot` is meant to move to `agent-toolbox` as a self-contained crate,
# and the composer's `[dependencies]` below stays empty on purpose.
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[package]
name = "agent-playbook"
version = "0.1.0"
edition = "2021"
description = "Resolve and render agent rules for a project + target"
license = "MIT"

[[bin]]
name = "playbook"
path = "src/main.rs"

[lib]
name = "playbook"
path = "src/lib.rs"

# No dependencies, deliberately. The composer has to build with no network and no
# registry cache, because it is the tool you reach for when a repo's toolchain is the
# thing that is broken. std is enough for a flat `key: value` format. The workspace table
# above is for the tools; nothing here inherits it unless a crate names it.
[dependencies]

[profile.release]
lto = true
codegen-units = 1
