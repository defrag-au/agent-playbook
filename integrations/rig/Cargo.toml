# Its own workspace, deliberately: the playbook's composer builds with no dependencies, and
# `cargo test` at the root must not start building Bevy. rig loads this crate as a
# `[[plugins.extra]]`; it is checked and tested from this directory.
[workspace]

[package]
name = "rig-playbook"
version = "0.1.0"
edition = "2021"
description = "The agent-playbook enforced in rig: a redirect, a gate, and the toolkit's tools"
license = "MIT"

[dependencies]
# The exact harness the generated agent is built against. A plugin and its app must share a Bevy
# version, so this is pinned rather than ranged. The fork is selected by the patch below for this
# workspace, and by the launcher's own `[patch.crates-io]` when the plugin is built into an agent.
rig-harness = "=0.46.0"
# The verb catalogues and the reads themselves. `serde` is on so the typed answer can be published
# with the call's facts; the CLI does not enable it.
at-peek = { path = "../../tools/at-peek", features = ["serde"] }
at-recall = { path = "../../tools/at-recall" }
# The tool schemas derive from the argument types.
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# rig's own scripted-model harness: an app, a mock model, and collectors. Unpublished, so it comes
# from the checkout beside this repository rather than crates.io. Its own path dependencies resolve
# inside that checkout, which is the same path the patch below names.
rig-harness-test-support = { path = "../../../rig/test-support/rig-harness-test-support" }
# The built-in `shell` tool the redirect replaces. No `tui`: nothing here draws.
rig-basics = { path = "../../../rig/plugins/rig-basics", default-features = false }

# The fork. A patch in a dependency's manifest is ignored by a consuming workspace; this one applies
# to `cargo test` here, while an agent build gets its copy from the launcher's own patch.
[patch.crates-io]
rig-harness = { path = "../../../rig/crates/rig-harness" }
