# Its own workspace, deliberately: review-bench is an evaluation integration,
# not part of the composer. rig's dependency tree must not enter the playbook
# workspace. See docs/design/visual-review.md.
[workspace]

[package]
name = "review-bench"
version = "0.1.0"
edition = "2021"
description = "Score vision models on the macroquad-storybook review corpus"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
# The fork beside this repository, as integrations/rig does for rig-harness.
# `reqwest` is the bundled transport; rig-core's default `rustls` selects TLS.
rig-core = { path = "../../../rig/crates/rig-core", features = ["reqwest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.8"
