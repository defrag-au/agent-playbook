# Its own package, deliberately: the eval runner is not part of the plugin, and the plugin must not
# grow a second binary. It reads the `--json` stream, so it needs no rig dependency.
[workspace]

[package]
name = "rig-eval"
version = "0.1.0"
edition = "2021"
description = "Score the playbook's rig homes over real-work scenarios"
license = "MIT"

[dependencies]
# Error context on every path that can fail; the runner has no error taxonomy worth a type.
anyhow = "1.0"
# The command line, its help, and the checks clap can express (a required path, a count of at
# least one). See references/crates/clap-4.6.md in the playbook.
clap = { version = "4.6", features = ["derive"] }
# A `.env`-shaped file, parsed by the crate that does it: quotes, comments and `export` included.
dotenvy = "0.15"
# The citation scan. The same crate `at-peek search` uses for its pattern language; the answer's
# `path:line` shape is exactly a regex.
regex = "1.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
