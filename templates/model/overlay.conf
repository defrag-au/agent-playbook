target: <name>
model: <model | any>
harness: <harness | any>
include: <path prefixes or rule ids to force in — only needed for activation: manual rules>
exclude: <rule ids or path prefixes to drop>
emphasis: <rule ids to repeat in the Non-negotiable preamble>
addenda: <filenames in addenda/, in the order they should appear>
default_file: <AGENTS.md | CLAUDE.md>
# Copy to models/<name>/overlay.conf.
#
# last reviewed: <YYYY-MM-DD>
#
# Every line here is a claim about a specific model or harness, paid for on every turn. Write
# it from an observed failure, not from reputation. When the model changes, revisit — an
# overlay written for one release and never checked is a rule that silently stops being true.
#
# What must NOT go here:
#   - a behavioural rule (that is rules/, with `targets: <name>` if only one model needs it)
#   - anything that contradicts a rule (if a target needs to beat a project rule, the rule is
#     wrong — fix the rule)
#   - org or project specifics
