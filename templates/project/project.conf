project: <name>
org: <the org that operates this repo, or leave empty>
ecosystems: <comma-separated, e.g. defrag, or leave empty>
renders: <comma-separated, e.g. egui, macroquad, or leave empty>
languages: <comma-separated, e.g. rust, or leave empty>
default_target: claude-code
skills: <comma-separated skill-store sources, e.g. github:defrag-au/container-compose#container-compose@v1, or leave empty>
# Copy to <repo>/.playbook/project.conf, and put repo-specific rules in
# <repo>/.playbook/rules/ beside it. `playbook init` writes this file for you.
#
# `skills:` is delivered by `playbook skills sync`, not resolved: each source is an OCFL object,
# exported and copied into the harness's project skill directory, with the version and tree
# digest recorded in `.playbook/skills.lock`. See docs/skills.md.
#
# There is no `path:` key: the manifest's directory is the repository.
#
# The layer test before adding a rule here: is it true of exactly one repository? Anything
# true of two belongs in rules/<language>/ or rules/org/<org>/ instead. Move it up the moment
# a second consumer needs it.
#
# `org` selects which rules/org/<org>/ rules activate. A repo with no org simply gets none,
# which is the correct outcome rather than an error. `ecosystems` is what the repo is *built*
# with, `renders` is what it draws with, and `languages` is what it is written in.
