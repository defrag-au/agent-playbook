[package]
name = "at-describe"
version = "0.1.0"
edition = "2021"
description = "Tier 0 of the agent toolkit: the catalogue, and nothing else"
license = "MIT"

# One dependency, and it is a sibling in this workspace rather than a crate from a registry:
# at-describe prints verb tables, and the tables live with the verbs so the two cannot drift.
# Nothing else is linked.
[dependencies]
at-peek = { path = "../at-peek" }
