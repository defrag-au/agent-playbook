[package]
name = "at-describe"
version = "0.1.0"
edition = "2021"
description = "Tier 0 of the agent toolkit: the catalogue, and nothing else"
license = "MIT"

# The toolkit's verb tables, linked so this catalogue cannot describe a grammar the binaries do
# not enforce. They are siblings in this workspace rather than crates from a registry. Nothing
# else is linked.
[dependencies]
at-cost = { workspace = true }
at-crate = { workspace = true }
at-peek = { workspace = true }
at-reach = { workspace = true }
at-recall = { workspace = true }
