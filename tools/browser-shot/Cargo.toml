[package]
name = "browser-shot"
version = "0.1.0"
edition = "2021"
description = "Launch a browser, wait for a stable frame, and write a screenshot plus a report"
license = "MIT"
publish = false

[[bin]]
name = "browser-shot"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { workspace = true }
libc = "0.2"
# `headless_chrome` returns CDP's `RemoteObject.value` as `serde_json::Value`, which is the
# dynamic-external-API case the typed-JSON rule exempts.
serde = { workspace = true }
serde_json = { workspace = true }
toml = "1"
# `headless_chrome` owns the browser process and kills it on drop, which is the property
# the hand-rolled Node loop lacked. `offline` generates the CDP bindings from the protocol
# JSON shipped with the crate, so the build needs no network beyond the registry.
headless_chrome = { version = "1.0.22", default-features = false, features = ["offline"] }
