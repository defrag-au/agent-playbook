name: Build

# `flake.nix`'s packages are the contract. `defrag-nix` takes `agent-tools`, `playbook`
# and the `*-shot` tools from this repository and wires them into every repository's
# devshell, so a package that stops building breaks every shell in the org.
#
# The environment matters more than the source. `defrag-nix` pins its own nixpkgs, and
# this repository pins another; nixpkgs' Rust hook is not the same in both. In the
# consumer pin it enables `cargoUseSystemLibs`, which exports
# `ZSTD_SYS_USE_PKG_CONFIG` for `zstd-sys`, so a crate that bundles its C zstd under
# plain cargo instead needs `pkg-config` and `zstd` in the derivation. Building `.#`
# here exercises only this repository's pin and does not see that. The consumer build
# below is therefore the gate that matters.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    name: Nix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # A failure on one platform is not a reason to hide the other: the Linux leg is
      # the cross-platform conformance check, and the macOS leg is the one consumers
      # actually evaluate.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v32
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            # One derivation at a time. These are 3-4 core runners with a small disk;
            # letting Nix start several release builds at once makes their cargo `-j`
            # settings compete and turns the build log into interleaved noise.
            max-jobs = 1

      # The consumer build, and the reason this workflow exists. `defrag-nix` evaluates
      # `agent-playbook.packages` with its own nixpkgs and its own Rust hook; override
      # the input so it builds this checkout, exactly as a devshell does. With no
      # `--keep-going`, the failing package is the answer, and the other packages are
      # never started.
      - name: Build the consumer toolkit
        run: |
          nix build --no-link --print-build-logs \
            --override-input agent-playbook "path:$GITHUB_WORKSPACE" \
            "github:defrag-au/defrag-nix#agent-tools"

      # Under this repository's own pin, which is what `nix build .#…` and the tests
      # use. `agent-tools` is absent here because the consumer build above already
      # built it, under the stricter nixpkgs.
      - name: Build the remaining packages
        run: |
          nix build --no-link --print-build-logs \
            .#playbook \
            .#browser-shot \
            .#tui-shot \
            .#android-shot \
            .#image-shot \
            .#fleet-sync \
            .#travel-secrets \
            .#skill-store \
            .#zed-thread-tools

      # `flake.nix` says `nix flake check` runs the suite rather than only evaluating
      # the outputs. Run it here so that claim is a gate instead of a note. The suite
      # stays on the developer platform: the Linux leg's job is the package contract,
      # and running the whole test build twice buys nothing for this check.
      - name: Flake checks
        if: runner.os == 'macOS'
        run: nix flake check --print-build-logs
