project: mitos
path: ~/code/defrag/mitos
org: defrag
ecosystems: defrag
languages: rust
default_target: claude-code
# The framework and its published-artifact crates: the data plane, the decoders, and the
# crates that *produce* what a browser or a Worker then reads (`live-book`, `tx-index`,
# `mithril-source`, `fetch-driver`).
#
# No instruction file existed in this repository before this entry — so the first install
# writes one, rather than the usual case of a repo whose own AGENTS.md or CLAUDE.md has to
# be reduced to what is genuinely local.
#
# What is local here has not produced a rule yet: the wasm-clean split
# (`default-features = false`, no `memmap2`, no `Instant`) is already covered by
# `rules/org/defrag/runtime-pairs`, and the devshell by `rules/rust/devshell-first`. A rule
# belongs in `rules/` beside this file the moment something is true of mitos and not of its
# siblings.
