# A native egui desktop app: photo folders played as an endless looping montage. It
# consumes egui-widgets and ui-theme from shared-crates, so the egui rule set applies at
# full strength. Its devshell is defrag-nix's `rust-stable` — no Worker, wasm or chain
# tooling in its workflow — which still carries the `at-*` toolkit.
