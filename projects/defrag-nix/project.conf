project: defrag-nix
path: ~/code/defrag/defrag-nix
org: defrag
ecosystems: defrag
default_target: claude-code
# The shared devshell flake every other defrag repository takes its shell from. It has no
# devshell of its own and no instruction file, so this entry is what puts the ecosystem rules —
# including `agent-tools` — in front of an agent working on the flake itself.
#
# No `languages:`. This repository is Nix, even though it builds the Rust toolchain; the
# ecosystem activation is what makes the `at-*` rule true here.
