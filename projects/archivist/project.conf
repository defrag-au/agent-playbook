project: archivist
path: ~/code/hodlcroft/archivist
org: hodlcroft
ecosystems: defrag
languages: rust
default_target: claude-code
# hodlcroft, not defrag — so rules/org/defrag/ does not activate here. That is the
# point of the org layer: the D1 and widget rules are not true of this repo, and a
# flat rule set would have applied them anyway.
