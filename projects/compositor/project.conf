project: compositor
path: ~/code/hodlcroft/compositor
org: hodlcroft
ecosystems: defrag
languages: rust
default_target: claude-code
# hodlcroft, not defrag, for the reason projects/archivist gives: the defrag org layer is
# mostly about the cnft services and the egui widget libraries — ncli, D1 write economics,
# the api-types layout, the widget catalogue, the egui traps — and none of that is true here.
# The org layer exists so those rules do not have to be argued away one at a time.
#
# `ecosystems: defrag` is the other half of that: the repo is built with the defrag toolchain —
# `defrag-nix`'s `rust-worker-stack` shell, and so the `at-*` inspection toolkit — and rules
# about *how it is built* key on that, not on the directory it lives in. Who operates it is
# `org: hodlcroft`; what it is built like is `ecosystem: defrag`.
#
# `default_target: claude-code` because `.claude/settings.local.json` is in the repo. Zed reads
# `AGENTS.md` here (it outranks `CLAUDE.md` in that harness's search order), so both targets are
# installed and neither file is left without the block.
