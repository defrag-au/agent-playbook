project: augminted-bots
path: ~/code/defrag/augminted-bots
org: defrag
ecosystems: defrag
# egui: declared because the org rule set already reached this repo and its block must not
# change under the `renders:` axis (the playtest lab under games/ is egui). macroquad: the game
# clients under games/*/apps/ (fight-macroquad is the reference client, 2026-10-18).
renders: egui, macroquad
languages: rust
default_target: claude-code
