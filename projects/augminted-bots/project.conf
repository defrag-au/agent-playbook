# and the ecosystem rule sets are true of it.
#
# rules/ beside this file holds only what was written for this repo directly (the macroquad
# bundling rule, 2026-10-16). The repo's hand-written CLAUDE.md predates the block and has
# still not been triaged into rule candidates.
