project: personal
path: ~/.config/zed
org:
languages:
default_target: zed-personal
# Not a repository. This is the project with **no org and no language**, which is what makes
# it useful: activation matching then resolves to exactly the `activation: always` rules —
# the set that is true of every project, which is precisely what belongs in Zed's personal
# instructions file.
#
# `path` is a config directory rather than a repo root, so `playbook install --project
# personal --repo ~/.config/zed` writes `~/.config/zed/AGENTS.md`.
#
# Do not add an org or a language here. Either one would pull rules into a file that loads
# for repositories the playbook knows nothing about — see the test
# `the_personal_target_carries_only_universal_rules`.